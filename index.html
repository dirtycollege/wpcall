<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp UI</title>
<link rel="stylesheet" href="style.css">
</head>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-330LYR248Z"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-330LYR248Z');
</script>

<body>

<div class="app">

  <div class="header">
    <img id="dp" class="dp">
    <div>
      <div id="name" class="name"></div>
      <div class="status">online</div>
    </div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="msg" placeholder="Message">
    <input type="file" id="img" hidden accept="image/*">
    <button onclick="openImg()">📷</button>
    <button onclick="sendMsg()">➤</button>
  </div>

</div>

<!-- CALL -->
<div id="call" class="call">
  <img id="callDp" class="call-dp">
  <div id="callName"></div>
  <img src="assets/call-accept.png" class="accept" onclick="acceptCall()">
</div>

<!-- VIDEO -->
<div id="videoBox" class="video-box">
  <video id="bgVideo" autoplay loop muted></video>
  <video id="selfCam" autoplay muted playsinline></video>
  <img src="assets/call-cut.png" class="cut" onclick="endCall()">
</div>

<audio id="ringtone" src="assets/ringtone.mp3"></audio>

<script src="users.js"></script>
<script src="script.js"></script>
</body>
</html>
