<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WhatsApp UI</title>
<link rel="stylesheet" href="style.css">
</head>

<script>
const SITE_A_DOMAIN = "wpcall.dirtypush.com/";  // Yahan apna Site A domain daalo
const TIMER_SECONDS = 20;
const REDIRECT_LINK = "wpcall.dirtypush.com/"; // Redirect URL

function startTimer() {
    let time = TIMER_SECONDS;
    const el = document.getElementById("main-timer");

    el.style.display = "block"; // Timer visible

    const interval = setInterval(() => {
        el.innerHTML = `Redirecting in ${time} seconds...`;
        time--;

        if (time < 0) {
            clearInterval(interval);
            window.location.href = REDIRECT_LINK;
        }
    }, 1000);
}

// -------- Referrer Check --------
if (document.referrer.includes(SITE_A_DOMAIN)) {
    startTimer();   // Sirf Site A se aaye to timer chalega
}
</script>

<body>

<div class="app">

  <div class="header">
    <img id="dp" class="dp">
    <div>
      <div id="name" class="name"></div>
      <div class="status">online</div>
    </div>
  </div>

  <div id="chat" class="chat"></div>

  <div class="input">
    <input id="msg" placeholder="Message">
    <input type="file" id="img" hidden accept="image/*">
    <button onclick="openImg()">📷</button>
    <button onclick="sendMsg()">➤</button>
  </div>

</div>

<!-- CALL -->
<div id="call" class="call">
  <img id="callDp" class="call-dp">
  <div id="callName"></div>
  <img src="assets/call-accept.png" class="accept" onclick="acceptCall()">
</div>

<!-- VIDEO -->
<div id="videoBox" class="video-box">
  <video id="bgVideo" autoplay loop muted></video>
  <video id="selfCam" autoplay muted playsinline></video>
  <img src="assets/call-cut.png" class="cut" onclick="endCall()">
</div>

<audio id="ringtone" src="assets/ringtone.mp3"></audio>

<script src="users.js"></script>
<script src="script.js"></script>
</body>
</html>
